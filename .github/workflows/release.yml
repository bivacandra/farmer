name: Build and Release Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --clean tantra_farmer.spec

      - name: Compress Release Archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist/TantraFarmer/* -DestinationPath dist/TantraFarmer-Windows.zip -Force

      - name: Determine Release Tag
        id: release_info
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "${{ github.event.inputs.tag_name }}"
          }
          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "Tantra Farmer Macro Release ${{ steps.release_info.outputs.tag }}"
          body: |
            ### 🚜 Tantra Farmer Macro - Standalone Release (${{ steps.release_info.outputs.tag }})
            
            **Fitur Utama:**
            - 🔐 **Password Protected**: Aplikasi diproteksi dengan password otentikasi.
            - ⚡ **Auto Skill Macro**: Slot 1-0, F1-F10, E/R/F dengan timer countdown detik mundur real-time.
            - 🎒 **Auto Move Inventory to Storage & Seller**: Mendukung whitelist & blacklist slot scan.
            - 🏹 **Auto Hunt Synchronization**: Integrasi skill berkala saat berburu.
            
            **Cara Penggunaan:**
            1. Download file `TantraFarmer-Windows.zip` di bawah ini.
            2. Ekstrak file zip ke folder mana saja di PC Windows Anda.
            3. Jalankan `TantraFarmer.exe`.
            4. Masukkan password akses saat diminta.
            5. Gunakan hotkey **F11** untuk Mulai dan **F12** untuk Berhenti.
          files: |
            dist/TantraFarmer-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
