name: Build and Release Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --clean tantra_farmer.spec

      - name: Compress Release Archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist/TantraFarmer -DestinationPath dist/TantraFarmer-Windows.zip -Force
          Copy-Item dist/TantraFarmer/TantraFarmer.exe -Destination dist/TantraFarmer.exe

      - name: Determine Release Tag
        id: release_info
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "${{ github.event.inputs.tag_name }}"
          }
          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          }
          & $iscc "/DAppVersion=${{ steps.release_info.outputs.tag }}" installer.iss

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "Tantra Farmer Macro Release ${{ steps.release_info.outputs.tag }}"
          body: |
            ### 🚜 Tantra Farmer Macro - Release (${{ steps.release_info.outputs.tag }})
            
            **Pilihan Download:**
            - 📦 **`TantraFarmer-Setup.exe` (Sangat Disarankan / Installer)**:
              - Setup instalasi otomatis dengan icon shortcut di Desktop & Start Menu.
              - Path aplikasi permanen di PC Anda, mencegah masalah terbukanya versi lama setelah auto-update.
            - 📁 **`TantraFarmer-Windows.zip` (Versi Portable)**:
              - Ekstrak seluruh file zip ke folder mana saja (seperti Desktop) dan langsung jalankan `TantraFarmer.exe` tanpa perlu instalasi.
            
            **Fitur Utama:**
            - 🔐 **Password Protected**: Aplikasi diproteksi dengan password otentikasi (`Mysamsung123`).
            - ⚡ **Auto Skill Macro**: Slot 1-0, F1-F10, E/R/F dengan timer countdown detik mundur real-time.
            - 🎒 **Auto Move Inventory to Storage & Seller**: Mendukung whitelist & blacklist slot scan.
            - 🏹 **Auto Hunt Synchronization**: Integrasi skill berkala saat berburu.
            
            **Cara Penggunaan:**
            1. Download `TantraFarmer-Setup.exe` dan jalankan instalasi, atau ekstrak `TantraFarmer-Windows.zip`.
            2. Jalankan `TantraFarmer.exe`.
            3. Masukkan password akses (`Mysamsung123`) saat diminta.
            4. Gunakan hotkey **F11** untuk Mulai dan **F12** untuk Berhenti.
          files: |
            dist/TantraFarmer-Setup.exe
            dist/TantraFarmer-Windows.zip
            dist/TantraFarmer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
